<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 交通分析自进化 Harness · 应用图标:信号灯 + 进化循环环 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset=".55" stop-color="#141b3a"/>
      <stop offset="1" stop-color="#251a45"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".44" r=".62">
      <stop offset="0" stop-color="#34d399" stop-opacity=".32"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- 路网肌理 -->
  <g stroke="#67e8f9" stroke-width="2" fill="none" opacity=".14">
    <path d="M40 120 H180 L240 180 H472"/>
    <path d="M40 392 H150 L216 330 H472"/>
    <path d="M120 40 V150 L190 216 V472"/>
    <path d="M330 40 V180 L392 244 V472"/>
  </g>
  <g fill="#67e8f9" opacity=".28">
    <circle cx="180" cy="120" r="5"/><circle cx="392" cy="244" r="5"/>
    <circle cx="150" cy="392" r="5"/><circle cx="190" cy="216" r="5"/>
  </g>

  <circle cx="256" cy="256" r="186" fill="url(#glow)"/>

  <!-- 进化循环环(留缺口 + 箭头,寓意持续进化) -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ring)"
          stroke-width="11" stroke-linecap="round" stroke-dasharray="880 176"
          transform="rotate(-118 256 256)"/>
  <polygon points="352,98 376,112 356,132" fill="#22d3ee" filter="url(#soft2)"/>
  <polygon points="352,98 376,112 356,132" fill="#a5f3fc"/>

  <!-- 环上运行节点 -->
  <circle cx="112" cy="330" r="9" fill="#a5b4fc"/>
  <circle cx="398" cy="356" r="9" fill="#34d399"/>
  <circle cx="330" cy="106" r="8" fill="#67e8f9"/>

  <!-- 信号灯主体 -->
  <rect x="214" y="158" width="84" height="196" rx="22" fill="#0b1120"
        stroke="url(#ring)" stroke-width="5"/>
  <rect x="226" y="170" width="60" height="172" rx="14" fill="#0e1730"/>

  <circle cx="256" cy="206" r="21" fill="#ef4444" opacity=".22"/>
  <circle cx="256" cy="256" r="21" fill="#f59e0b" opacity=".22"/>
  <circle cx="256" cy="306" r="26" fill="#34d399" opacity=".45" filter="url(#soft)"/>
  <circle cx="256" cy="306" r="20" fill="#34d399"/>
  <circle cx="249" cy="299" r="6" fill="#d1fae5" opacity=".85"/>
</svg>
