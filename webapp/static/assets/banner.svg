<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400"
 viewBox="0 0 1280 400" role="img" aria-label="Transportation Harness · 交通分析自进化评测系统">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset=".55" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f5fb"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobP" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".3"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#8ea2c9" opacity=".13"/>
    </pattern>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <ellipse cx="1060" cy="120" rx="480" ry="260" fill="url(#blobP)"/>
  <ellipse cx="220" cy="380" rx="460" ry="240" fill="url(#blobC)"/>

  <!-- 数据光轨 -->
  <path d="M-40 340 C 300 280, 640 360, 980 280 S 1240 180, 1330 190"
        fill="none" stroke="url(#trail)" stroke-width="10" stroke-linecap="round"
        opacity=".45" filter="url(#blurL)"/>
  <path d="M-40 340 C 300 280, 640 360, 980 280 S 1240 180, 1330 190"
        fill="none" stroke="url(#trail)" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>

  <!-- 进化轨道大环(右侧) -->
  <g transform="rotate(-16 1040 175)" fill="none">
    <ellipse cx="1040" cy="175" rx="228" ry="80" stroke="url(#ring)" stroke-width="4.5"
             stroke-dasharray="1130 290" stroke-linecap="round" opacity=".62"/>
    <path d="M1256 144 L 1272 162 L 1252 177" stroke="#22d3ee" stroke-width="6"
         stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <circle cx="812" cy="175" r="7" fill="#a5b4fc" opacity=".9"/>
    <circle cx="965" cy="97" r="8" fill="#34d399" opacity=".95"/>
    <circle cx="1160" cy="122" r="5.5" fill="#67e8f9" opacity=".9"/>
  </g>

  <!-- 天际线与路面 -->
  <g fill="#0a0f28" opacity=".95">
    <rect x="560" y="306" width="40" height="60"/><rect x="608" y="322" width="48" height="44"/>
    <rect x="1120" y="286" width="44" height="80"/>
    <rect x="1172" y="312" width="52" height="54"/>
  </g>
  <path d="M-20 374 L 1300 374 L 1300 336 L -20 336 Z" fill="#0d142e"/>
  <path d="M-20 336 H 1300" stroke="#2b3660" stroke-width="2" opacity=".7"/>
  <path d="M-20 356 H 1300" stroke="#67e8f9" stroke-width="4.5"
        stroke-linecap="round" stroke-dasharray="30 24" opacity=".5"/>

  <!-- 品牌区:内联应用图标 + 字标 -->
  <svg x="72" y="104" width="176" height="176" viewBox="0 0 512 512">
  <!-- 交通分析自进化 Harness · 应用图标「信号灯 × 进化轨道 × 城市路网」
       绿灯大而亮 = 评测通过放行;倾斜轨道环 = 持续自进化;底部路网与天际线 = 交通领域 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset=".55" stop-color="#10183a"/>
      <stop offset="1" stop-color="#241a48"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".5"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambientP" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".75"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="cr"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g clip-path="url(#cr)">

  <!-- 环境光 -->
  <ellipse cx="256" cy="240" rx="215" ry="185" fill="url(#ambientP)"/>
  <ellipse cx="150" cy="410" rx="210" ry="140" fill="url(#ambientC)"/>

  <!-- 对角数据光轨 -->
  <path d="M56 438 C 190 396, 316 292, 456 92" fill="none" stroke="url(#trail)"
        stroke-width="14" stroke-linecap="round" opacity=".5" filter="url(#blurL)"/>
  <path d="M56 438 C 190 396, 316 292, 456 92" fill="none" stroke="url(#trail)"
        stroke-width="3.5" stroke-linecap="round" opacity=".8"/>

  <!-- 底部城市天际线剪影 -->
  <g fill="#0a0f28" opacity=".92">
    <rect x="52" y="376" width="44" height="66"/>
    <rect x="104" y="344" width="34" height="98"/>
    <rect x="146" y="392" width="40" height="50"/>
    <rect x="318" y="386" width="36" height="56"/>
    <rect x="362" y="352" width="42" height="90"/>
    <rect x="412" y="396" width="44" height="46"/>
    <polygon points="236,442 236,368 256,348 276,368 276,442"/>
  </g>
  <g fill="#67e8f9" opacity=".5">
    <rect x="112" y="356" width="5" height="5"/><rect x="124" y="372" width="5" height="5"/>
    <rect x="372" y="364" width="5" height="5"/><rect x="386" y="382" width="5" height="5"/>
    <rect x="62" y="390" width="4.5" height="4.5"/><rect x="420" y="408" width="4.5" height="4.5"/>
  </g>

  <!-- 路面(信号灯立于其上) -->
  <path d="M20 474 L 492 474 L 468 428 L 44 428 Z" fill="#0d142e"/>
  <path d="M44 428 H 468" stroke="#2b3660" stroke-width="2.5" opacity=".8"/>
  <path d="M56 451 H 456" stroke="#67e8f9" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="26 20" opacity=".55"/>

  <!-- 绿灯照亮路面的光锥 -->
  <polygon points="234,296 278,296 318,428 194,428" fill="url(#beam)" opacity=".16"/>

  <!-- 进化轨道(后段,置于信号灯之后) -->
  <g transform="rotate(-16 256 300)">
    <path d="M71 300 A 185 62 0 0 1 441 300" fill="none" stroke="url(#ring)"
          stroke-width="7" stroke-linecap="round" opacity=".35"/>
    <circle cx="330" cy="246" r="5" fill="#c7d2fe" opacity=".7"/>
  </g>

  <!-- 信号灯主体 -->
  <rect x="212" y="126" width="88" height="200" rx="26" fill="#0b1120"
        stroke="url(#ring)" stroke-width="6"/>
  <rect x="222" y="136" width="68" height="180" rx="19" fill="#0e1730"/>
  <circle cx="256" cy="176" r="13" fill="#ef4444" opacity=".26"/>
  <circle cx="256" cy="220" r="13" fill="#f59e0b" opacity=".3"/>
  <circle cx="256" cy="278" r="30" fill="url(#greenGlow)"/>
  <circle cx="256" cy="278" r="24" fill="#34d399" opacity=".4" filter="url(#blurS)"/>
  <circle cx="256" cy="278" r="17.5" fill="#34d399"/>
  <circle cx="249.5" cy="271.5" r="5.5" fill="#d1fae5" opacity=".9"/>
  <rect x="246" y="326" width="20" height="76" rx="6" fill="#101830" stroke="#2b3660" stroke-width="2"/>
  <rect x="222" y="398" width="68" height="15" rx="7.5" fill="#101830" stroke="#2b3660" stroke-width="2"/>

  <!-- 进化轨道(前段,压过信号灯之前) -->
  <g transform="rotate(-16 256 300)">
    <path d="M71 300 A 185 62 0 0 0 441 300" fill="none" stroke="url(#ring)"
          stroke-width="9" stroke-linecap="round"/>
    <path d="M432 316 L 448 298 L 432 280" fill="none" stroke="#22d3ee"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="300" r="7" fill="#a5b4fc"/>
    <circle cx="256" cy="362" r="8" fill="#34d399"/>
    <circle cx="420" cy="318" r="5.5" fill="#67e8f9"/>
  </g>
  </g>
</svg>
  <text x="300" y="182" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="54" font-weight="800" letter-spacing=".5" fill="url(#tg)">Transportation Harness</text>
  <text x="303" y="224" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="21" font-weight="500" letter-spacing="6" fill="#8b98ad">交通分析自进化评测系统</text>
  <rect x="300" y="252" width="338" height="42" rx="21" fill="rgba(99,102,241,.10)" stroke="rgba(129,140,248,.45)" stroke-width="1.4"/>
  <text x="469.0" y="279" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="18" font-weight="600" letter-spacing="1" fill="#c7d2fe">评测驱动 · 自进化 · 回归守护</text>
  <rect x="652" y="252" width="218" height="42" rx="21" fill="rgba(99,102,241,.10)" stroke="rgba(52,211,153,.5)" stroke-width="1.4"/>
  <text x="761.0" y="279" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="18" font-weight="600" letter-spacing="1" fill="#6ee7b7">实测 7.7% → 100%</text>
  <rect x="884" y="252" width="150" height="42" rx="21" fill="rgba(99,102,241,.10)" stroke="rgba(96,165,250,.5)" stroke-width="1.4"/>
  <text x="959.0" y="279" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="18" font-weight="600" letter-spacing="1" fill="#93c5fd">全程零回归</text>
</svg>
