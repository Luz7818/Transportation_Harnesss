<svg xmlns="http://www.w3.org/2000/svg" width="680" height="160"
 viewBox="0 0 680 160" role="img" aria-label="Transportation Harness · 交通分析自进化评测系统">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f5fb"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
  </defs>
  <svg x="16" y="16" width="128" height="128" viewBox="0 0 512 512">
  <!-- 交通分析自进化 Harness · 应用图标「信号灯 × 进化轨道 × 城市路网」
       绿灯大而亮 = 评测通过放行;倾斜轨道环 = 持续自进化;底部路网与天际线 = 交通领域 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset=".55" stop-color="#10183a"/>
      <stop offset="1" stop-color="#241a48"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".5" stop-color="#67e8f9" stop-opacity=".85"/>
      <stop offset="1" stop-color="#a5f3fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity=".5"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambientP" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".26"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#34d399" stop-opacity=".75"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="cr"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g clip-path="url(#cr)">

  <!-- 环境光 -->
  <ellipse cx="256" cy="240" rx="215" ry="185" fill="url(#ambientP)"/>
  <ellipse cx="150" cy="410" rx="210" ry="140" fill="url(#ambientC)"/>

  <!-- 对角数据光轨 -->
  <path d="M56 438 C 190 396, 316 292, 456 92" fill="none" stroke="url(#trail)"
        stroke-width="14" stroke-linecap="round" opacity=".5" filter="url(#blurL)"/>
  <path d="M56 438 C 190 396, 316 292, 456 92" fill="none" stroke="url(#trail)"
        stroke-width="3.5" stroke-linecap="round" opacity=".8"/>

  <!-- 底部城市天际线剪影 -->
  <g fill="#0a0f28" opacity=".92">
    <rect x="52" y="376" width="44" height="66"/>
    <rect x="104" y="344" width="34" height="98"/>
    <rect x="146" y="392" width="40" height="50"/>
    <rect x="318" y="386" width="36" height="56"/>
    <rect x="362" y="352" width="42" height="90"/>
    <rect x="412" y="396" width="44" height="46"/>
    <polygon points="236,442 236,368 256,348 276,368 276,442"/>
  </g>
  <g fill="#67e8f9" opacity=".5">
    <rect x="112" y="356" width="5" height="5"/><rect x="124" y="372" width="5" height="5"/>
    <rect x="372" y="364" width="5" height="5"/><rect x="386" y="382" width="5" height="5"/>
    <rect x="62" y="390" width="4.5" height="4.5"/><rect x="420" y="408" width="4.5" height="4.5"/>
  </g>

  <!-- 路面(信号灯立于其上) -->
  <path d="M20 474 L 492 474 L 468 428 L 44 428 Z" fill="#0d142e"/>
  <path d="M44 428 H 468" stroke="#2b3660" stroke-width="2.5" opacity=".8"/>
  <path d="M56 451 H 456" stroke="#67e8f9" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="26 20" opacity=".55"/>

  <!-- 绿灯照亮路面的光锥 -->
  <polygon points="234,296 278,296 318,428 194,428" fill="url(#beam)" opacity=".16"/>

  <!-- 进化轨道(后段,置于信号灯之后) -->
  <g transform="rotate(-16 256 300)">
    <path d="M71 300 A 185 62 0 0 1 441 300" fill="none" stroke="url(#ring)"
          stroke-width="7" stroke-linecap="round" opacity=".35"/>
    <circle cx="330" cy="246" r="5" fill="#c7d2fe" opacity=".7"/>
  </g>

  <!-- 信号灯主体 -->
  <rect x="212" y="126" width="88" height="200" rx="26" fill="#0b1120"
        stroke="url(#ring)" stroke-width="6"/>
  <rect x="222" y="136" width="68" height="180" rx="19" fill="#0e1730"/>
  <circle cx="256" cy="176" r="13" fill="#ef4444" opacity=".26"/>
  <circle cx="256" cy="220" r="13" fill="#f59e0b" opacity=".3"/>
  <circle cx="256" cy="278" r="30" fill="url(#greenGlow)"/>
  <circle cx="256" cy="278" r="24" fill="#34d399" opacity=".4" filter="url(#blurS)"/>
  <circle cx="256" cy="278" r="17.5" fill="#34d399"/>
  <circle cx="249.5" cy="271.5" r="5.5" fill="#d1fae5" opacity=".9"/>
  <rect x="246" y="326" width="20" height="76" rx="6" fill="#101830" stroke="#2b3660" stroke-width="2"/>
  <rect x="222" y="398" width="68" height="15" rx="7.5" fill="#101830" stroke="#2b3660" stroke-width="2"/>

  <!-- 进化轨道(前段,压过信号灯之前) -->
  <g transform="rotate(-16 256 300)">
    <path d="M71 300 A 185 62 0 0 0 441 300" fill="none" stroke="url(#ring)"
          stroke-width="9" stroke-linecap="round"/>
    <path d="M432 316 L 448 298 L 432 280" fill="none" stroke="#22d3ee"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="300" r="7" fill="#a5b4fc"/>
    <circle cx="256" cy="362" r="8" fill="#34d399"/>
    <circle cx="420" cy="318" r="5.5" fill="#67e8f9"/>
  </g>
  </g>
</svg>
  <text x="172" y="78" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="42" font-weight="800" letter-spacing=".5" fill="url(#tg)">Transportation Harness</text>
  <text x="174" y="118" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif"
        font-size="17" font-weight="500" letter-spacing="5" fill="#8b98ad">交通分析自进化评测系统</text>
</svg>
