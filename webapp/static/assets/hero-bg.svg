<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- 欢迎页/登录页背景(暗色):石墨绿夜色 · 城市路网 · 一条放行主流线 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090b12"/>
      <stop offset=".45" stop-color="#0d1117"/>
      <stop offset=".8" stop-color="#131824"/>
      <stop offset="1" stop-color="#171d2b"/>
    </linearGradient>
    <radialGradient id="blobN" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#94a0bc" stop-opacity=".1"/>
      <stop offset="1" stop-color="#94a0bc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".14"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#818cf8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roadV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a0bc" stop-opacity="0"/>
      <stop offset=".5" stop-color="#94a0bc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#94a0bc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".75"/>
      <stop offset=".6" stop-color="#6366f1" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060a08" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#060a08" stop-opacity=".4"/>
      <stop offset="1" stop-color="#060a08" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a08" stop-opacity=".4"/>
      <stop offset="1" stop-color="#060a08" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#94a0bc" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <!-- 远处微光 -->
  <ellipse cx="1520" cy="220" rx="560" ry="380" fill="url(#blobN)"/>
  <ellipse cx="1050" cy="1010" rx="520" ry="300" fill="url(#blobG)"/>

  <!-- 城市路网主线 -->
  <g fill="none" stroke-linecap="round">
    <path d="M-40 780 C 360 700, 620 860, 980 760 S 1620 620, 1980 700"
          stroke="#818cf8" stroke-width="8" opacity=".12" filter="url(#blurL)"/>
    <path d="M-40 780 C 360 700, 620 860, 980 760 S 1620 620, 1980 700"
          stroke="url(#roadC)" stroke-width="3"/>
    <path d="M220 -40 C 300 260, 180 520, 360 820 S 560 1020, 620 1120"
          stroke="url(#roadV)" stroke-width="2.5"/>
    <path d="M-40 380 C 300 340, 560 430, 860 380 S 1500 300, 1980 360"
          stroke="#94a0bc" stroke-width="1.6" opacity=".3"/>
    <path d="M760 -40 C 820 220, 700 420, 840 640 S 980 920, 940 1120"
          stroke="#c7d2fe" stroke-width="1.4" opacity=".3"/>
    <path d="M1240 -40 C 1300 240, 1180 480, 1320 720 S 1420 980, 1400 1120"
          stroke="#94a0bc" stroke-width="1.4" opacity=".25"/>
  </g>

  <!-- 进化轨道大环(呼应自进化闭环,倾斜轨道 + 箭头 + 运行节点) -->
  <g transform="rotate(-16 1450 480)" fill="none">
    <ellipse cx="1450" cy="480" rx="300" ry="105" stroke="url(#ringG)" stroke-width="5"
             stroke-dasharray="1520 380" stroke-linecap="round" opacity=".6"/>
    <ellipse cx="1450" cy="480" rx="300" ry="105" stroke="#818cf8" stroke-width="14"
             opacity=".08" filter="url(#blurL)"/>
    <path d="M1736 436 L 1756 458 L 1730 476" stroke="#a5b4fc" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round" opacity=".85" filter="url(#blurS)"/>
    <circle cx="1150" cy="480" r="11" fill="#a5b4fc" opacity=".85"/>
    <circle cx="1385" cy="377" r="10" fill="#818cf8" opacity=".95"/>
    <circle cx="1630" cy="410" r="8" fill="#a5b4fc" opacity=".85"/>
    <circle r="4.5" fill="#c7d2fe" opacity=".95">
      <animateMotion dur="16s" repeatCount="indefinite" path="M1150 480 a300 105 0 1 0 600 0 a300 105 0 1 0 -600 0"/>
    </circle>
  </g>

  <!-- 天际线剪影(近景) -->
  <g fill="#0b0e13" opacity=".95">
    <rect x="1120" y="806" width="72" height="140"/><rect x="1204" y="762" width="56" height="184"/>
    <rect x="1272" y="830" width="64" height="116"/><rect x="1348" y="782" width="52" height="164"/>
    <rect x="1412" y="846" width="84" height="100"/><rect x="1508" y="800" width="60" height="146"/>
    <rect x="1580" y="858" width="88" height="88"/><rect x="1680" y="812" width="64" height="134"/>
    <rect x="1756" y="852" width="90" height="94"/><rect x="1858" y="800" width="70" height="146"/>
    <polygon points="1232,762 1232,806 1204,806 1260,742 1316,806 1272,806 1272,762"/>
  </g>
  <g fill="#a5b4fc" opacity=".38">
    <rect x="1216" y="786" width="8" height="8"/><rect x="1244" y="812" width="8" height="8"/>
    <rect x="1364" y="806" width="8" height="8"/><rect x="1390" y="842" width="8" height="8"/>
    <rect x="1532" y="826" width="8" height="8"/><rect x="1560" y="864" width="8" height="8"/>
    <rect x="1700" y="838" width="8" height="8"/><rect x="1726" y="884" width="8" height="8"/>
    <rect x="1880" y="826" width="8" height="8"/><rect x="1906" y="872" width="8" height="8"/>
  </g>

  <!-- 底部路面 -->
  <path d="M-20 986 L 1940 986 L 1940 946 L -20 946 Z" fill="#12161f"/>
  <path d="M-20 946 H 1940" stroke="#2f3a52" stroke-width="2.5" opacity=".7"/>
  <path d="M-20 966 H 1940" stroke="#a5b4fc" stroke-width="6"
        stroke-linecap="round" stroke-dasharray="42 34" opacity=".45"/>

  <!-- 数据流粒子 -->
  <g>
    <circle cx="420" cy="742" r="4" fill="#818cf8" opacity=".85"><animateMotion dur="9s" repeatCount="indefinite" path="M-40 780 C 360 700, 620 860, 980 760 S 1620 620, 1980 700"/></circle>
    <circle cx="420" cy="742" r="3" fill="#c7d2fe" opacity=".6"><animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite" path="M-40 780 C 360 700, 620 860, 980 760 S 1620 620, 1980 700"/></circle>
    <circle cx="352" cy="410" r="4" fill="#94a0bc" opacity=".7"><animateMotion dur="11s" repeatCount="indefinite" path="M220 -40 C 300 260, 180 520, 360 820 S 560 1020, 620 1120"/></circle>
    <circle cx="806" cy="330" r="3.4" fill="#a5b4fc" opacity=".7"><animateMotion dur="12s" begin="-6s" repeatCount="indefinite" path="M760 -40 C 820 220, 700 420, 840 640 S 980 920, 940 1120"/></circle>
    <circle cx="1284" cy="360" r="3.4" fill="#94a0bc" opacity=".65"><animateMotion dur="13s" begin="-3s" repeatCount="indefinite" path="M1240 -40 C 1300 240, 1180 480, 1320 720 S 1420 980, 1400 1120"/></circle>
    <circle cx="520" cy="398" r="3" fill="#a5b4fc" opacity=".5"><animateMotion dur="10s" begin="-2s" repeatCount="indefinite" path="M-40 380 C 300 340, 560 430, 860 380 S 1500 300, 1980 360"/></circle>
  </g>

  <!-- 路网节点 -->
  <g fill="#c7d2fe">
    <circle cx="360" cy="822" r="5" opacity=".8"/><circle cx="842" cy="638" r="5" opacity=".75"/>
    <circle cx="978" cy="760" r="5" opacity=".7"/><circle cx="860" cy="380" r="4.5" opacity=".65"/>
    <circle cx="190" cy="520" r="4" opacity=".55"/>
  </g>

  <!-- 顶部渐暗 + 左侧渐隐,保证标题文字可读 -->
  <rect width="1920" height="260" fill="url(#fadeT)"/>
  <rect width="1920" height="1080" fill="url(#fadeL)"/>
</svg>
