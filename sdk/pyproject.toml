[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "transportation-harness-sdk"
version = "1.5.0"
description = "交通分析自进化 Harness 的官方 Python SDK:评测、自进化、Case 管理、版本对比一站式客户端"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Transportation Harness Contributors" }]
keywords = ["transportation", "evaluation", "harness", "llm", "traffic"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
harness-client = "harness_client.cli:main"

[project.urls]
Documentation = "https://github.com/Luz7818/Transportation_Harnesss/blob/main/docs/INTEGRATION.md"

[tool.hatch.build.targets.wheel]
packages = ["harness_client"]
