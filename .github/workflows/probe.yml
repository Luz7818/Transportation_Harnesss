name: Live Probe

on:
  schedule:
    - cron: "0 22 * * *"   # 每天 UTC 22:00(北京时间次日 06:00)
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 线上健康探针(只读 /api/health)
        env:
          LIVE_HEALTH_URL: ${{ secrets.LIVE_HEALTH_URL }}
        run: python scripts/probe_live.py
